<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>お問い合わせの編集</title>
</head>

<body>
  <h1>お問い合わせの編集</h1>
  <form th:action="@{/admin/contacts/{id}/edit(id=${contactId})}" th:object="${editForm}" method="post">
    <input type="hidden" name="id" th:value="${contactId}" />

    <table border="1">
      <tr>
        <td>姓</td>
        <td>
          <input type="text" th:field="*{lastName}">
          <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color: red"></span>
        </td>
      </tr>
      <tr>
        <td>名</td>
        <td>
          <input type="text" th:field="*{firstName}">
          <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color: red"></span>
        </td>
      </tr>
      <tr>
        <td>メールアドレス</td>
        <td>
          <input type="email" th:field="*{email}">
          <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red"></span>
        </td>
      </tr>
      <tr>
        <td>電話番号</td>
        <td>
          <input type="tel" th:field="*{phone}">
          <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color: red"></span>
        </td>
      </tr>
      <tr>
        <td>郵便番号</td>
        <td>
          <input type="text" th:field="*{zipCode}">
          <span th:if="${#fields.hasErrors('zipCode')}" th:errors="*{zipCode}" style="color: red"></span>
        </td>
      </tr>
      <tr>
        <td>住所</td>
        <td>
          <input type="text" th:field="*{address}">
          <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" style="color: red"></span>
        </td>
      </tr>
      <tr>
        <td>建物名</td>
        <td>
          <input type="text" th:field="*{buildingName}">
          <span th:if="${#fields.hasErrors('buildingName')}" th:errors="*{buildingName}" style="color: red"></span>
        </td>
      </tr>
      <tr>
        <td>お問い合わせ種別</td>
        <td>
          <select th:field="*{contactType}">
            <option th:value="services" th:selected="${editForm.contactType == 'services'}">サービスに関するお問い合わせ</option>
            <option th:value="technicalQuestions" th:selected="${editForm.contactType == 'technicalQuestions'}">
              技術的なお問い合わせ</option>
            <option th:value="others" th:selected="${editForm.contactType == 'others'}">その他</option>
          </select>
          <span th:if="${#fields.hasErrors('contactType')}" th:errors="*{contactType}" style="color: red"></span>
        </td>
      </tr>
      <tr>
        <td>お問い合わせ内容</td>
        <td>
          <textarea th:field="*{body}" rows="4" cols="80"></textarea>
          <span th:if="${#fields.hasErrors('body')}" th:errors="*{body}" style="color: red"></span>
        </td>
      </tr>
    </table>
    <input type="submit" value="更新">
  </form>
  <form th:action="@{/admin/contacts/{id}/delete(id=${contactId})}" method="post">
    <input type="hidden" name="id" th:value="${contactId}">
    <input type="submit" value="削除" onclick="return confirm('本当に削除しますか？');"></input>
    </form>

    </form>
    <a th:href="@{/admin/contacts}">一覧に戻る</a>
    <a th:href="@{/admin/signin}">ログアウト</a>
</body>

</html>
